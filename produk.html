<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - Achmad Al Ghifari Noval Nabawi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #241209;
    color: #f3e6d8;
    min-height: 100vh;
  }
  a { color: inherit; }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 40px;
    background: #1c0d06;
    border-bottom: 1px solid #5c3a26;
  }
  .logo { font-size: 18px; font-weight: 700; color: #f8ede0; }
  .nav-links { display: flex; gap: 28px; list-style: none; }
  .nav-links a {
    text-decoration: none;
    color: #d9a679;
    font-size: 14px;
    font-weight: 600;
    padding-bottom: 4px;
  }
  .nav-links a:hover, .nav-links a.active { color: #f8ede0; border-bottom: 2px solid #6b1e2c; }

  .page-banner {
    position: relative;
    padding: 70px 40px;
    background: linear-gradient(135deg, #2b1810, #4a1420);
    overflow: hidden;
    text-align: center;
  }
  .page-banner-photo {
    position: absolute;
    inset: 0;
    background: url('foto-backround.jpg') center/cover;
    opacity: 0.35;
  }
  .page-banner h1 { position: relative; font-size: 30px; color: #f8ede0; }

  section { max-width: 900px; margin: 0 auto; padding: 40px 20px 60px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .produk {
    background: #3a2117;
    border: 1px solid #5c3a26;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
  }
  .produk img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #5c3a26;
  }
  .produk-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .produk-nama { font-size: 16px; font-weight: 600; color: #f8ede0; }
  .produk-harga { font-size: 15px; color: #d9a679; font-weight: 700; }
  .produk-desc { font-size: 13px; color: #c9a68a; line-height: 1.5; }
  .btn-beli {
    margin-top: auto;
    display: block;
    text-align: center;
    text-decoration: none;
    background: #6b1e2c;
    color: #f8ede0;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-beli:hover { background: #8a2a3c; }

  footer {
    text-align: center;
    padding: 30px;
    color: #8a6a55;
    font-size: 13px;
    border-top: 1px solid #3a2117;
  }

  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    nav { padding: 16px 20px; flex-direction: column; gap: 12px; }
    .page-banner { padding: 50px 20px; }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

  <nav>
    <div class="logo">Portofolio</div>
    <ul class="nav-links">
      <li><a href="index.html">Profile</a></li>
      <li><a href="tugas.html">Tugas</a></li>
      <li><a href="produk.html" class="active">Produk</a></li>
      <li><a href="strategi.html">Strategi</a></li>
      <li><a href="sosmed.html">Sosmed</a></li>
    </ul>
  </nav>

  <div class="page-banner">
    <div class="page-banner-photo"></div>
    <h1>Produk</h1>
  </div>

  <section>
    <div class="grid">

      <!-- ===== COPY BLOK DI BAWAH INI UNTUK TAMBAH PRODUK BARU ===== -->
      <div class="produk">

          <a class="btn-beli" href="https://wa.me/6285697728172?text=Halo%2C%20saya%20mau%20pesan%20Kemeja%20Veterani%20Marron" target="_blank">Pesan via WhatsApp</a>

        </div>

    </div>
  </section>

  <footer>
    &copy; 2026 Achmad Al Ghifari Noval Nabawi
  </footer>

</body>
</html>
